<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Parceiro - AgilizaAê</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-body">

    <header class="header">

        <div class="logo">
            <a href="home.html">Agiliza<span>Aê</span></a>
        </div>

        <nav class="menu">
            <a href="maquinas.html">Máquinas</a>
            <a href="sobre.html">Sobre</a>
            <a href="parceiros.html" class="ativo">Parceiros</a>
        </nav>

        <div class="acoes">
            <a href="parceiros.html" class="btn-carrinho">Seja um parceiro</a>
        </div>

    </header>

    <main class="auth-main auth-main--centralizado">

        <div class="auth-card auth-card--pequeno">

            <!-- LOGO -->
            <div class="auth-logo">
                <span class="auth-logo-icone">🤝</span>
                <h1>Agiliza<span>Aê</span></h1>
            </div>

            <!-- BADGE -->
            <div style="display:flex; justify-content:center; margin-bottom:8px;">
                <span style="
                    background:#fff3ef;
                    color:#ff5a1f;
                    font-size:11px;
                    font-weight:700;
                    letter-spacing:1px;
                    text-transform:uppercase;
                    padding:5px 14px;
                    border-radius:20px;
                ">Área do Parceiro</span>
            </div>

            <div class="auth-titulo">
                <h2>Acesse sua conta</h2>
                <p>Gerencie vendas, produtos e impacto ESG</p>
            </div>

            <form id="formLoginParceiro" novalidate>

                <div class="auth-secao">

                    <div class="campo">
                        <label for="email">E-mail corporativo</label>
                        <input id="email" type="email" placeholder="joao@empresa.com.br" autocomplete="email">
                        <span class="erro" id="erro-email"></span>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="input-senha">
                            <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
                            <button type="button" class="toggle-senha" data-alvo="senha">👁</button>
                        </div>
                        <span class="erro" id="erro-senha"></span>
                    </div>

                    <div class="login-opcoes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="lembrar">
                            Lembrar acesso
                        </label>
                        <a href="esqueci-senha.html" class="link-esqueci">Esqueci a senha</a>
                    </div>

                </div>

                <!-- SEPARADOR EMPRESA -->
                <div style="
                    background:#f5f5f5;
                    border-radius:12px;
                    padding:14px 16px;
                    margin-bottom:20px;
                    display:flex;
                    align-items:center;
                    gap:10px;
                ">
                    <span style="font-size:20px;">🏪</span>
                    <div>
                        <strong style="font-size:13px; display:block;">Pão Sabor Ltda.</strong>
                        <span style="font-size:12px; color:#777;">CNPJ: 12.345.678/0001-90</span>
                    </div>
                    <span
                        style="margin-left:auto; font-size:11px; font-weight:700; background:#e8f5e9; color:#2e7d32; padding:3px 10px; border-radius:20px;">Ativo</span>
                </div>

                <div class="auth-acoes">
                    <button type="submit" class="btn-auth" id="btnEntrarParceiro">
                        <span class="btn-texto">Acessar dashboard</span>
                        <span class="btn-loading" hidden>Aguarde...</span>
                    </button>
                </div>

                <p class="auth-link">
                    Ainda não é parceiro? <a href="parceiros.html">Cadastre sua empresa</a>
                </p>

                <p class="auth-link" style="margin-top:8px;">
                    É cliente? <a href="login.html">Entrar como cliente</a>
                </p>

            </form>

        </div>

    </main>

    <script>
        // Toggle senha
        document.querySelectorAll('.toggle-senha').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.alvo);
                const visivel = input.type === 'text';
                input.type = visivel ? 'password' : 'text';
                btn.textContent = visivel ? '👁' : '🙈';
            });
        });

        // Submit
        document.getElementById('formLoginParceiro').addEventListener('submit', async e => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            document.getElementById('erro-email').textContent = '';
            document.getElementById('erro-senha').textContent = '';

            let ok = true;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('erro-email').textContent = 'E-mail inválido.';
                ok = false;
            }

            if (senha.length < 6) {
                document.getElementById('erro-senha').textContent = 'Informe sua senha.';
                ok = false;
            }

            if (!ok) return;

            const btn = document.getElementById('btnEntrarParceiro');
            const texto = btn.querySelector('.btn-texto');
            const load = btn.querySelector('.btn-loading');

            btn.disabled = true;
            texto.hidden = true;
            load.hidden = false;

            await new Promise(r => setTimeout(r, 1500));

            btn.disabled = false;
            texto.hidden = false;
            load.hidden = true;

            window.location.href = 'dashboard-parceiro.html';
        });
    </script>

</body>

</html>
