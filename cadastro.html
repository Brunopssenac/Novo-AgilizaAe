<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AgilizaAê</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-body">

    <header class="header">

        <div class="logo">
            <a href="home.html">Agiliza<span>Aê</span></a>
        </div>

        <nav class="menu">
            <a href="maquinas.html">Máquinas</a>
            <a href="sobre.html">Sobre</a>
            <a href="parceiros.html">Parceiros</a>
        </nav>

        <div class="acoes">
            <a href="login.html" class="btn-entrar">Entrar</a>
        </div>

    </header>

    <main class="auth-main">

        <div class="auth-card">

            <div class="auth-titulo">
                <h1>Criar conta</h1>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </div>

            <form id="formCadastro" novalidate>

                <!-- DADOS DE ACESSO -->
                <div class="auth-secao">
                    <span class="auth-secao-label">Dados de acesso</span>

                    <div class="campo-grupo dois">
                        <div class="campo">
                            <label for="nome">Nome completo</label>
                            <input id="nome" type="text" placeholder="João da Silva" autocomplete="name">
                            <span class="erro" id="erro-nome"></span>
                        </div>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input id="email" type="email" placeholder="joao@email.com" autocomplete="email">
                            <span class="erro" id="erro-email"></span>
                        </div>
                    </div>

                    <div class="campo-grupo dois">
                        <div class="campo">
                            <label for="senha">Senha</label>
                            <div class="input-senha">
                                <input id="senha" type="password" placeholder="Mínimo 8 caracteres"
                                    autocomplete="new-password">
                                <button type="button" class="toggle-senha" data-alvo="senha">👁</button>
                            </div>
                            <span class="erro" id="erro-senha"></span>
                        </div>
                        <div class="campo">
                            <label for="confirmarSenha">Confirmar senha</label>
                            <div class="input-senha">
                                <input id="confirmarSenha" type="password" placeholder="Repita a senha"
                                    autocomplete="new-password">
                                <button type="button" class="toggle-senha" data-alvo="confirmarSenha">👁</button>
                            </div>
                            <span class="erro" id="erro-confirmarSenha"></span>
                        </div>
                    </div>
                </div>

                <!-- DADOS PESSOAIS -->
                <div class="auth-secao">
                    <span class="auth-secao-label">Dados pessoais</span>

                    <div class="campo-grupo dois">
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14">
                            <span class="erro" id="erro-cpf"></span>
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input id="telefone" type="text" placeholder="(11) 90000-0000" maxlength="15">
                            <span class="erro" id="erro-telefone"></span>
                        </div>
                    </div>
                </div>

                <!-- ENDEREÇO -->
                <div class="auth-secao">
                    <span class="auth-secao-label">Endereço</span>

                    <div class="campo-grupo cep-grupo">
                        <div class="campo">
                            <label for="cep">CEP</label>
                            <div class="input-cep">
                                <input id="cep" type="text" placeholder="00000-000" maxlength="9">
                                <button type="button" id="btnBuscarCep" class="btn-cep">Buscar</button>
                            </div>
                            <span class="erro" id="erro-cep"></span>
                        </div>
                    </div>

                    <div class="campo-grupo tres">
                        <div class="campo campo-rua">
                            <label for="rua">Rua</label>
                            <input id="rua" type="text" placeholder="Nome da rua">
                        </div>
                        <div class="campo campo-numero">
                            <label for="numero">Número</label>
                            <input id="numero" type="text" placeholder="123">
                        </div>
                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input id="bairro" type="text" placeholder="Nome do bairro">
                        </div>
                    </div>

                    <div class="campo-grupo dois">
                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input id="cidade" type="text" placeholder="São Paulo">
                        </div>
                        <div class="campo">
                            <label for="estado">Estado</label>
                            <select id="estado">
                                <option value="">Selecione</option>
                                <option>AC</option>
                                <option>AL</option>
                                <option>AM</option>
                                <option>AP</option>
                                <option>BA</option>
                                <option>CE</option>
                                <option>DF</option>
                                <option>ES</option>
                                <option>GO</option>
                                <option>MA</option>
                                <option>MG</option>
                                <option>MS</option>
                                <option>MT</option>
                                <option>PA</option>
                                <option>PB</option>
                                <option>PE</option>
                                <option>PI</option>
                                <option>PR</option>
                                <option>RJ</option>
                                <option>RN</option>
                                <option>RO</option>
                                <option>RR</option>
                                <option>RS</option>
                                <option>SC</option>
                                <option>SE</option>
                                <option>SP</option>
                                <option>TO</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="auth-acoes">
                    <button type="submit" class="btn-auth" id="btnCadastrar">
                        <span class="btn-texto">Criar conta</span>
                        <span class="btn-loading" hidden>Aguarde...</span>
                    </button>
                </div>

                <p class="auth-link">
                    Já tem uma conta? <a href="login.html">Entrar</a>
                </p>

            </form>

        </div>

    </main>

    <script src="auth.js"></script>

</body>

</html>
